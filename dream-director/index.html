function useIsDesktop(){
  const [d,setD]=useState(window.innerWidth>=768);
  useEffect(()=>{
    const h=()=>setD(window.innerWidth>=768);
    window.addEventListener('resize',h);
    return ()=>window.removeEventListener('resize',h);
  },[]);
  return d;
}

function extractJSON(text){
  try{return JSON.parse(text);}catch(e){}
  const m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const start=text.indexOf('{');
  const end=text.lastIndexOf('}');
  if(start!==-1&&end!==-1){try{return JSON.parse(text.slice(start,end+1));}catch(e){}}
  throw new Error('Could not parse response as JSON');
}

function timeAgo(dateStr){
  const diff=Date.now()-new Date(dateStr).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return 'just now';
  if(m<60)return `${m}m ago`;
  const h=Math.floor(m/60);
  if(h<24)return `${h}h ago`;
  return `${Math.floor(h/24)}d ago`;
}

function getMomentumMessage(allVideos, products){
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekAgo = new Date(todayStart.getTime() - 7*86400000);

  // Days since last video
  if(allVideos.length > 0){
    const sorted = [...allVideos].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    const last = new Date(sorted[0].created_at);
    const daysSince = Math.floor((todayStart - new Date(last.getFullYear(),last.getMonth(),last.getDate())) / 86400000);
    if(daysSince >= 3) return `It's been ${daysSince} days. One video today puts you back on track.`;
  }

  // Campaign goal checks
  for(const p of products){
    const pv = allVideos.filter(v=>v.product_id===p.id);
    const goal = p.video_goal||20;
    if(pv.length >= goal) return `${p.name} campaign complete. Time to pick the next product.`;
    const remaining = goal - pv.length;
    if(remaining <= 3 && remaining > 0) return `You're ${remaining} video${remaining>1?'s':''} away from your ${p.name} goal. Finish it.`;
  }

  // Streak
  let streak=0;
  for(let i=0;i<30;i++){
    const dayStart=new Date(todayStart.getTime()-i*86400000);
    const dayEnd=new Date(dayStart.getTime()+86400000);
    const has=allVideos.some(v=>{const d=new Date(v.created_at);return d>=dayStart&&d<dayEnd;});
    if(has) streak++;
    else break;
  }
  if(streak>=7) return "7 days straight. This is what separates creators.";

  const videosToday = allVideos.filter(v=>new Date(v.created_at)>=todayStart).length;
  if(videosToday>=3) return "Daily goal hit. ✓ Keep the streak alive tomorrow.";

  const videosWeek = allVideos.filter(v=>new Date(v.created_at)>=weekAgo).length;
  if(videosWeek>=1&&videosWeek<3) return "Good start. 3 videos a day is the target — you're building.";
  return "No videos logged yet this week. First one is the hardest.";
}

function PillSelect({options,value,onChange,multi=false}){

    {options.map(o=>{
      const k=typeof o==='string'?o:o.key;

      return <button key={k} onClick={()=>{

function LogVideoModal({products,preProduct,preFormat,preFunnel,onClose,onSave}){
  const [productId,setProductId]=useState(preProduct||products[0]?.id||'');
  const [format,setFormat]=useState(preFormat||'TH');
  const [funnel,setFunnel]=useState(preFunnel||'MOF');

  const [saving,setSaving]=useState(false);

  async function save(){
    if(!productId)return;
    setSaving(true);
    const {data,error}=await sb.from('videos').insert({
      user_id:(await sb.auth.getUser()).data.user.id,
      product_id:productId, format, funnel, notes:note
    }).select().single();
    setSaving(false);
    if(!error&&data) onSave(data);
    onClose();

  return <BottomSheet onClose={onClose}>
    <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,marginBottom:24}}>Log Video</div>

function ProductForm({product,onSave,onClose}){
  const [name,setName]=useState(product?.name||'');
  const [cat,setCat]=useState(product?.category||'');
  const [icp,setIcp]=useState(product?.icp||'');
  const [comm,setComm]=useState(product?.commission||'');
  const [goal,setGoal]=useState(product?.video_goal||20);
  const [deadline,setDeadline]=useState(product?.goal_deadline||'');
  const [cname,setCname]=useState(product?.contact_name||'');
  const [cmethod,setCmethod]=useState(product?.contact_method||'');
  const [notes,setNotes]=useState(product?.notes_private||'');
  const [saving,setSaving]=useState(false);

  async function save(e){
    e.preventDefault();setSaving(true);
    const uid=(await sb.auth.getUser()).data.user.id;
    const payload={user_id:uid,name,category:cat,icp,commission:comm,
      video_goal:parseInt(goal)||20,goal_deadline:deadline||null,
      contact_name:cname,contact_method:cmethod,notes_private:notes};
    let data,error;
    if(product?.id){
      ({data,error}=await sb.from('products').update(payload).eq('id',product.id).select().single());
    }else{
      ({data,error}=await sb.from('products').insert(payload).select().single());
    }
    setSaving(false);
    if(!error&&data) onSave(data,!!product?.id);
    onClose();
  }

  return <Modal onClose={onClose} maxWidth={520}>
    <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,marginBottom:24}}>
      {product?'Edit Product':'New Product'}
    </div>
    <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:16}}>
      <div><Lbl>Product Name *</Lbl>
        <input style={inp} value={name} onChange={e=>setName(e.target.value)} required placeholder="e.g. HiSmile V34"/>
      </div>
      <div style={{display:'flex',gap:12}}>
        <div style={{flex:1}}><Lbl>Category</Lbl>
          <input style={inp} value={cat} onChange={e=>setCat(e.target.value)} placeholder="e.g. Oral Care"/>
        </div>
        <div style={{flex:1}}><Lbl>Commission</Lbl>
          <input style={inp} value={comm} onChange={e=>setComm(e.target.value)} placeholder="e.g. 25%"/>
        </div>
      </div>
      <div><Lbl>ICP — Who buys this?</Lbl>
        <input style={inp} value={icp} onChange={e=>setIcp(e.target.value)} placeholder="e.g. 25-40F, self-conscious about smile"/>
      </div>
      <div style={{display:'flex',gap:12}}>
        <div style={{flex:1}}><Lbl>Video Goal</Lbl>
          <input style={inp} type="number" value={goal} onChange={e=>setGoal(e.target.value)} min={1}/>
        </div>
        <div style={{flex:1}}><Lbl>Deadline</Lbl>
          <input style={{...inp}} type="date" value={deadline} onChange={e=>setDeadline(e.target.value)}/>
        </div>
      </div>
      <div style={{display:'flex',gap:12}}>
        <div style={{flex:1}}><Lbl>Contact Name</Lbl>
          <input style={inp} value={cname} onChange={e=>setCname(e.target.value)} placeholder="e.g. Sophie"/>
        </div>
        <div style={{flex:1}}><Lbl>Contact Method</Lbl>
          <input style={inp} value={cmethod} onChange={e=>setCmethod(e.target.value)} placeholder="e.g. WhatsApp"/>
        </div>
      </div>
      <div><Lbl>Notes / Language to Use</Lbl>
        <textarea style={{...inp,minHeight:80}} value={notes} onChange={e=>setNotes(e.target.value)}
          placeholder="Contact info, goals, reminders, anything relevant..."/>
      </div>
      <div style={{display:'flex',gap:10,marginTop:4}}>

        <GhostBtn onClick={onClose} style={{flex:1}}>Cancel</GhostBtn>

  const [error,setError]=useState('');

  const SOURCE_COLORS={'Reddit':'#ff4500','Amazon Reviews':'#ff9900','TikTok Comments':'#69c9d0','YouTube':'#ff0000','Google':'#4285f4'};

  async function scan(){
    setLoading(true);setError('');setResults(null);
    const userMsg=`You are researching real consumer pain points for: ${product.name}
Category: ${product.category||'Unknown'}
ICP: ${product.icp||'Unknown'}

Analyze what real people say in Amazon reviews, Reddit threads, TikTok comments, YouTube comments, and Google searches about this product category and the problems it solves.

Return the top 10 most emotionally resonant pain points in the exact language real people use. Not marketing language. Real frustrated human language.

For each pain point, assign the most likely source (Amazon Reviews / Reddit / TikTok Comments / YouTube / Google).

Return ONLY this JSON:
{
  "pain_points": [
    {
      "pain": "exact pain point in real human language",
      "source": "Amazon Reviews|Reddit|TikTok Comments|YouTube|Google",
      "angle": "one-line suggested content angle based on this pain"
    }
  ]
}`;
    try{
      const res=await fetch('/.netlify/functions/generate',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({system:PAIN_POINT_SYSTEM_PROMPT,messages:[{role:'user',content:userMsg}]})
      });
      const data=await res.json();
      if(data.error)throw new Error(typeof data.error==='object'?JSON.stringify(data.error):data.error);
      const text=data.content?.[0]?.text||'';
      const parsed=extractJSON(text);
      setResults(parsed.pain_points||[]);
    }catch(err){setError(err.message);}
    finally{setLoading(false);}
  }

  function handleOpen(){
    if(!open){setOpen(true);if(!results&&!loading)scan();}
    else{setOpen(false);}
  }

  return <div style={{marginBottom:12}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <button onClick={handleOpen} style={{

        padding:0,fontFamily:"'Inter',sans-serif",display:'flex',alignItems:'center',gap:6
      }}>
        {open?'▾':'▸'} Pain Point Research
      </button>
      {!open&&<button onClick={()=>{setOpen(true);if(!results&&!loading)scan();}} style={{
        background:'none',border:`1px solid ${C.border}`,borderRadius:20,
        color:C.accent,fontSize:11,cursor:'pointer',padding:'3px 10px',
        fontFamily:"'JetBrains Mono',monospace"
      }}>Scan →</button>}
    </div>

    {open&&<div style={{marginTop:14}}>
      {loading&&<div className="glow-pulse" style={{
        background:C.surfaceEl,borderRadius:10,padding:'16px 18px',
        border:`1px solid ${C.accent}33`,color:C.textSec,fontSize:13,textAlign:'center'
      }}>
        Scanning reviews, comments, Reddit, Amazon...
      </div>}

      {error&&<div style={{color:C.danger,fontSize:13,padding:'8px 0'}}>{error}
        <button onClick={scan} style={{background:'none',border:'none',color:C.accent,cursor:'pointer',marginLeft:8,fontSize:13}}>Retry</button>
      </div>}

      {results&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <Lbl style={{marginBottom:0}}>Top Pain Points</Lbl>
          <button onClick={scan} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>Rescan</button>
        </div>
        {results.map((pp,i)=><div key={i} style={{
          background:C.surfaceEl,borderRadius:10,padding:'12px 14px',
          border:`1px solid ${C.border}`
        }}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:8}}>
            <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.textMuted,flexShrink:0,marginTop:2}}>{String(i+1).padStart(2,'0')}</span>
              <div style={{fontSize:13,color:C.text,lineHeight:1.65}}>{pp.pain}</div>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <span style={{
                display:'inline-block',padding:'2px 8px',borderRadius:20,fontSize:10,
                fontFamily:"'JetBrains Mono',monospace",fontWeight:500,
                color:SOURCE_COLORS[pp.source]||C.textSec,
                background:(SOURCE_COLORS[pp.source]||C.textSec)+'22'
              }}>{pp.source}</span>
              {pp.angle&&<span style={{fontSize:11,color:C.textMuted,fontStyle:'italic'}}>{pp.angle}</span>}
            </div>
            <button onClick={()=>onUseAsAngle(product.id,pp.pain)} style={{
              background:C.accentSoft,border:`1px solid ${C.accent}44`,borderRadius:20,
              color:C.accent,fontSize:11,cursor:'pointer',padding:'4px 12px',
              fontFamily:"'JetBrains Mono',monospace",whiteSpace:'nowrap'
            }}>Use as Angle →</button>
          </div>
        </div>)}
      </div>}
    </div>}
  </div>;
}

// ── PRODUCT CARD ──────────────────────────────────
function getNextMove(videos){
  const n=videos.length;
  const hasSK=videos.some(v=>v.format==='SK');
  const hasGS=videos.some(v=>v.format==='GS');
  const mof=videos.filter(v=>v.funnel==='MOF').length;
  const mofPct=n?Math.round(mof/n*100):0;
  if(n===0) return "Film your first video. Talking Head. Open with the problem — never the product.";
  if(n<=3&&!hasSK) return "You haven't tried a Skit yet. Highest converting format. Product reveal at the very end.";
  if(n>=5&&mofPct<50) return "Shift to MOF — that's where conversions live. Attack what they've already tried.";
  if(n>=6&&!hasGS) return "Try a Green Screen counterposition angle.";
  if(n>=5&&n<15) return "Keep building. Danny's rule: 15-20 before you judge the product.";
  return "Enough data. Which format is getting the most follows per view? Double down on that one.";
}

    />}

}

function DirectorView({user,products,presetProductId,presetAngle,allVideos,setAllVideos,vault,captures}){
  const [mode,setMode]=useState('plan');
  const [productId,setProductId]=useState(presetProductId||products[0]?.id||'');
  const [format,setFormat]=useState('TH');
  const [funnel,setFunnel]=useState('MOF');
  const [angle,setAngle]=useState(presetAngle||'');
  const [script,setScript]=useState('');
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState('');
  const [logModal,setLogModal]=useState(false);
  const [vaultMatch,setVaultMatch]=useState('');

  useEffect(()=>{if(presetProductId)setProductId(presetProductId);},[presetProductId]);
  useEffect(()=>{if(presetAngle)setAngle(presetAngle);},[presetAngle]);

  const selectedProd=products.find(p=>p.id===productId);

  async function generate(e){
    e.preventDefault();
    setLoading(true);setError('');setResult(null);setVaultMatch('');
    const prod=products.find(p=>p.id===productId);

    // Build intelligence context
    let additionalCtx='';
    const relevantVault=vault.filter(v=>v.format===format&&v.funnel===funnel);
    if(relevantVault.length>0){
      const vEntry=relevantVault[0];
      setVaultMatch(`"${vEntry.title}" used this format successfully.`);
      additionalCtx+=`\nVault inspiration: "${vEntry.title}" — ${vEntry.why_it_works||''} (Hook rating: ${vEntry.hook_rating||'?'}/5)`;
    }
    if(angle){additionalCtx+=`\nSelected pain point / angle: ${angle}`;}
    const productCaptures=captures.filter(c=>c.product_id===productId);
    if(productCaptures.length>0){
      additionalCtx+=`\nCreator's captured ideas: ${productCaptures.map(c=>c.idea).join('; ')}`;
    }

    const intelligenceSection=additionalCtx?`\n\nADDITIONAL CONTEXT (use if provided):${additionalCtx}\n\nIncorporate these naturally into the shot plan. Reference the pain point in opening angle suggestions. Use vault insights to inform format and pacing decisions.`:'';

    const userMsg=mode==='plan'
      ?`Generate a full shot plan for this product.

Product: ${prod?.name||'Unknown'}
Category: ${prod?.category||''}
ICP: ${prod?.icp||''}
Format: ${FORMATS.find(f=>f.key===format)?.label||format}
Funnel: ${funnel}
Additional context: ${angle||'None provided'}
Product notes/language: ${prod?.notes_private||'None'}${intelligenceSection}

Return a complete shot-by-shot plan as valid JSON.`
      :`Analyze and improve this script.

Product: ${prod?.name||'Unknown'}
Format: ${FORMATS.find(f=>f.key===format)?.label||format}
Funnel: ${funnel}

Script to analyze:
${script}

Return JSON with: {"score": 0-100, "flags": ["issue 1",...], "wins": ["win 1",...], "improved_script": "string", "shot_plan": {full shot plan object}}`;

    try{
      const res=await fetch('/.netlify/functions/generate',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({system:SYSTEM_PROMPT,messages:[{role:'user',content:userMsg}]})
      });
      const data=await res.json();
      if(data.error)throw new Error(typeof data.error==='object'?JSON.stringify(data.error):data.error);
      const text=data.content?.[0]?.text||'';
      const parsed=extractJSON(text);
      setResult(parsed);
    }catch(err){setError(err.message);}
    finally{setLoading(false);}
  }

  function handleVideoSave(v){setAllVideos(prev=>[...prev,v]);}

  const hasContext=angle||vault.some(v=>v.format===format&&v.funnel===funnel)||captures.some(c=>c.product_id===productId);

  return <div style={{padding:'32px 24px',maxWidth:900,margin:'0 auto'}}>
    <div style={{marginBottom:32}}>
      <div style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:C.text,letterSpacing:'-0.01em'}}>Director</div>
      <div style={{fontSize:13,color:C.textMuted,marginTop:4}}>
        {products.length===0?'Pick a product. We\'ll handle the rest.':'AI content generator'}
      </div>
    </div>

    <div style={{display:'flex',background:C.surface,border:`1px solid ${C.border}`,
      borderRadius:10,padding:4,marginBottom:24,gap:4}}>
      {[{k:'plan',l:'Full Shot Plan'},{k:'feedback',l:'Script Feedback'}].map(m=>
        <button key={m.k} onClick={()=>setMode(m.k)} style={{
          flex:1,padding:'9px',background:mode===m.k?C.accent:'transparent',
          color:mode===m.k?'#fff':C.textSec,border:'none',borderRadius:7,
          fontWeight:500,fontSize:13,cursor:'pointer'
        }}>{m.l}</button>
      )}
    </div>

    <form onSubmit={generate} style={{display:'flex',flexDirection:'column',gap:20,marginBottom:32}}>
      <div>
        <Lbl>Product</Lbl>
        {products.length===0
          ?<div style={{color:C.textMuted,fontSize:13,padding:'12px 0',fontStyle:'italic'}}>
            Pick a product. We'll handle the rest.
          </div>
          :<select style={inp} value={productId} onChange={e=>setProductId(e.target.value)} required>
            <option value="">Select a product...</option>
            {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        }
        {selectedProd?.icp&&<div style={{marginTop:8,fontSize:12,color:C.textMuted}}>ICP: {selectedProd.icp}</div>}
      </div>

      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:200}}>
          <Lbl>Format</Lbl>
          <PillSelect options={FORMATS} value={format} onChange={setFormat}/>
        </div>
        <div style={{flex:1,minWidth:200}}>
          <Lbl>Funnel Stage</Lbl>
          <PillSelect options={FUNNELS} value={funnel} onChange={setFunnel}/>
          {funnel==='BOF'&&<div style={{fontSize:11,color:C.danger,marginTop:6}}>⚠ BOF kills reach. Consider MOF instead.</div>}
        </div>
      </div>

      {/* Context indicators */}
      {hasContext&&productId&&<div style={{
        background:C.accentSoft,border:`1px solid ${C.accent}33`,borderRadius:8,
        padding:'10px 14px',fontSize:12,color:C.accent
      }}>
        Intelligence active: {[
          angle&&'pain point selected',
          vault.some(v=>v.format===format&&v.funnel===funnel)&&'vault match found',
          captures.filter(c=>c.product_id===productId).length>0&&`${captures.filter(c=>c.product_id===productId).length} idea(s) captured`
        ].filter(Boolean).join(' · ')}
      </div>}

      {mode==='plan'
        ?<div>
          <Lbl>Content Angle / Context (optional)</Lbl>
          <textarea style={{...inp,minHeight:80}}
            value={angle} onChange={e=>setAngle(e.target.value)}
            placeholder="What problem are you hitting? Pain point from research? Any specific angle?"/>
        </div>
        :<div>
          <Lbl>Paste Your Script</Lbl>
          <textarea style={{...inp,minHeight:160}}
            value={script} onChange={e=>setScript(e.target.value)}
            placeholder="Paste your script, hook, or any content you want analyzed..." required/>
        </div>
      }

      <Btn full disabled={loading||!productId}>
        {loading?'Crafting your content...':mode==='plan'?'Generate Shot Plan →':'Analyze Script →'}
      </Btn>
    </form>

    {loading&&<div className="breathe" style={{
      textAlign:'center',color:C.textSec,fontSize:14,padding:'48px 0'
    }}>Crafting your content...</div>}

    {error&&<div style={{padding:16,background:C.danger+'11',border:`1px solid ${C.danger}33`,
      borderRadius:10,color:C.danger,fontSize:13,marginBottom:24}}>{error}</div>}

    {result&&!loading&&<ShotPlanResults
      data={result.shot_plan||result}
      onLogVideo={()=>setLogModal({productId,format,funnel})}
      vaultMatch={vaultMatch}
    />}

    {logModal&&<LogVideoModal
      products={products}
      preProduct={logModal.productId}
      preFormat={logModal.format}
      preFunnel={logModal.funnel}
      onClose={()=>setLogModal(false)}
      onSave={handleVideoSave}
    />}
  </div>;
}

// ── VAULT ENTRY FORM ──────────────────────────────
function VaultEntryForm({entry,onSave,onClose}){
  const [title,setTitle]=useState(entry?.title||'');
  const [url,setUrl]=useState(entry?.url||'');
  const [niche,setNiche]=useState(entry?.niche||'');
  const [format,setFormat]=useState(entry?.format||'TH');
  const [funnel,setFunnel]=useState(entry?.funnel||'MOF');
  const [why,setWhy]=useState(entry?.why_it_works||'');
  const [rating,setRating]=useState(entry?.hook_rating||0);
  const [saving,setSaving]=useState(false);

  async function save(e){
    e.preventDefault();setSaving(true);
    const uid=(await sb.auth.getUser()).data.user.id;
    const payload={user_id:uid,title,url,niche,format,funnel,why_it_works:why,hook_rating:rating};
    let data,error;
    if(entry?.id){
      ({data,error}=await sb.from('vault').update(payload).eq('id',entry.id).select().single());
    }else{
      ({data,error}=await sb.from('vault').insert(payload).select().single());
    }
    setSaving(false);
    if(!error&&data)onSave(data,!!entry?.id);
    onClose();
  }

  return <Modal onClose={onClose} maxWidth={500}>
    <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,marginBottom:24}}>
      {entry?'Edit Entry':'Save Video'}
    </div>
    <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:16}}>
      <div><Lbl>Title *</Lbl>
        <input style={inp} value={title} onChange={e=>setTitle(e.target.value)} required placeholder="Video title or short description"/>
      </div>
      <div><Lbl>URL (optional)</Lbl>
        <input style={inp} value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://..."/>
      </div>
      <div><Lbl>Product / Niche</Lbl>
        <input style={inp} value={niche} onChange={e=>setNiche(e.target.value)} placeholder="e.g. Oral Care, Skincare..."/>
      </div>
      <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:180}}><Lbl>Format</Lbl>
          <PillSelect options={FORMATS} value={format} onChange={setFormat}/>
        </div>
        <div style={{flex:1,minWidth:180}}><Lbl>Funnel</Lbl>
          <PillSelect options={FUNNELS} value={funnel} onChange={setFunnel}/>
        </div>
      </div>
      <div><Lbl>Why It Works</Lbl>
        <textarea style={{...inp,minHeight:100}} value={why} onChange={e=>setWhy(e.target.value)}
          placeholder="What made this video stop the scroll? Hook type, angle, pacing..."/>
      </div>
      <div><Lbl>Hook Rating</Lbl>
        <StarRating value={rating} onChange={setRating}/>
      </div>
      <div style={{display:'flex',gap:10,marginTop:4}}>
        <Btn full disabled={saving}>{saving?'Saving…':entry?'Save Changes':'Save to Vault'}</Btn>
        <GhostBtn onClick={onClose} style={{flex:1}}>Cancel</GhostBtn>
      </div>
    </form>
  </Modal>;
}

                <div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,color:C.text,marginBottom:6}}>
                  {entry.title}

                {entry.url&&<a href={entry.url} target="_blank" rel="noopener noreferrer" style={{
                  fontSize:11,color:C.textMuted,fontFamily:"'JetBrains Mono',monospace",
                  wordBreak:'break-all'
                }}>{entry.url.slice(0,60)}{entry.url.length>60?'...':''}</a>}

              <StarRating value={entry.hook_rating||0} readonly/>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
              {entry.niche&&<Badge color={C.textSec}>{entry.niche}</Badge>}
              {entry.format&&<Badge color={C.accent}>{entry.format}</Badge>}
              {entry.funnel&&<Badge color={entry.funnel==='MOF'?C.success:entry.funnel==='BOF'?C.danger:C.textSec}>{entry.funnel}</Badge>}

              fontSize:13,color:C.text,lineHeight:1.65,
              background:C.surfaceEl,borderRadius:8,padding:'10px 12px',marginBottom:14
            }}>{entry.why_it_works}</div>}
            <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
              <Btn small onClick={()=>onUseAsInspiration(entry)}>Use as Inspiration →</Btn>
              <GhostBtn small onClick={()=>setEditEntry(entry)}>Edit</GhostBtn>
              {delId!==entry.id
                ?<GhostBtn small danger onClick={()=>setDelId(entry.id)}>Delete</GhostBtn>
                :<div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <span style={{fontSize:12,color:C.danger}}>Sure?</span>
                  <GhostBtn small danger onClick={()=>handleDelete(entry.id)}>Yes</GhostBtn>
                  <GhostBtn small onClick={()=>setDelId(null)}>No</GhostBtn>
                </div>
              }
            </div>
          </Card>)}
        </div>
      }

    {(showAdd||editEntry)&&<VaultEntryForm

    />}
  </div>;
}

function QuickCaptureModal({products,onClose,onSave}){
  const ideaRef=useRef(null);
  const [idea,setIdea]=useState('');
  const [productId,setProductId]=useState('');
  const [type,setType]=useState('Hook Idea');
  const [saving,setSaving]=useState(false);

  useEffect(()=>{setTimeout(()=>ideaRef.current?.focus(),100);},[]);

  async function save(e){
    e.preventDefault();
    if(!idea.trim())return;
    setSaving(true);
    const uid=(await sb.auth.getUser()).data.user.id;
    const {data,error}=await sb.from('captures').insert({
      user_id:uid,idea:idea.trim(),
      product_id:productId||null,type
    }).select().single();
    setSaving(false);
    if(!error&&data)onSave(data);
    onClose();
  }

  return <Modal onClose={onClose} maxWidth={440}>
    <div style={{fontFamily:"'Instrument Serif',serif",fontSize:22,marginBottom:20}}>Quick Capture</div>
    <form onSubmit={save} style={{display:'flex',flexDirection:'column',gap:16}}>
      <div>
        <Lbl>What's the idea?</Lbl>
        <textarea ref={ideaRef} style={{...inp,minHeight:100}}
          value={idea} onChange={e=>setIdea(e.target.value)}
          placeholder="Hook idea, weird angle, b-roll shot, reminder..." required/>
      </div>
      <div>
        <Lbl>Type</Lbl>
        <PillSelect options={CAPTURE_TYPES} value={type} onChange={setType}/>
      </div>
      <div>
        <Lbl>Product (optional)</Lbl>
        <select style={inp} value={productId} onChange={e=>setProductId(e.target.value)}>
          <option value="">No product</option>
          {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
      <div style={{display:'flex',gap:10,marginTop:4}}>
        <Btn full disabled={saving||!idea.trim()}>{saving?'Saving…':'Save Idea'}</Btn>
        <GhostBtn onClick={onClose} style={{flex:1}}>Cancel</GhostBtn>
      </div>
    </form>
  </Modal>;
}

// ── NAV ICONS ─────────────────────────────────────
function NavIcon({name,active}){
  const col=active?C.accent:C.textMuted;
  const w=20,h=20,sw=1.5;
  const icons={
    products:<svg width={w} height={h} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      <rect x="2" y="3" width="6" height="6"/><rect x="9" y="3" width="13" height="3"/>
      <rect x="9" y="9" width="13" height="3"/><rect x="2" y="12" width="6" height="6"/>
      <rect x="9" y="14" width="13" height="3"/>
    </svg>,
    director:<svg width={w} height={h} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </svg>,
    vault:<svg width={w} height={h} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/>
    </svg>,
    playbook:<svg width={w} height={h} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
    </svg>
  };
  return icons[name]||null;
}

const VIEWS=[{k:'products',l:'Products'},{k:'director',l:'Director'},{k:'vault',l:'Vault'},{k:'playbook',l:'Playbook'}];

// ── APP ───────────────────────────────────────────
function App(){
  const [user,setUser]=useState(null);
  const [view,setView]=useState('products');
  const [authLoading,setAuthLoading]=useState(true);
  const [products,setProducts]=useState([]);
  const [allVideos,setAllVideos]=useState([]);
  const [vault,setVault]=useState([]);
  const [captures,setCaptures]=useState([]);
  const [directorPreset,setDirectorPreset]=useState(null);
  const [directorAngle,setDirectorAngle]=useState('');
  const [showCapture,setShowCapture]=useState(false);
  const isDesktop=useIsDesktop();

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user||null);setAuthLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null);});
    return ()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!user)return;
    sb.from('products').select('*').eq('user_id',user.id).order('created_at').then(({data})=>setProducts(data||[]));
    sb.from('videos').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).then(({data})=>setAllVideos(data||[]));
    sb.from('vault').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).then(({data})=>setVault(data||[]));
    sb.from('captures').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).then(({data})=>setCaptures(data||[]));
  },[user]);

  // Keyboard shortcut: N = open quick capture
  useEffect(()=>{
    function handler(e){
      if(!user)return;
      if(e.key==='n'||e.key==='N'){
        const tag=document.activeElement?.tagName;
        if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
        e.preventDefault();
        setShowCapture(true);
      }
    }
    window.addEventListener('keydown',handler);
    return ()=>window.removeEventListener('keydown',handler);
  },[user]);

  function goToDirector(productId,angle=''){
    setDirectorPreset(productId);
    setDirectorAngle(angle);
    setView('director');
  }

  function handleUseAsAngle(productId,painPoint){
    goToDirector(productId,painPoint);
  }

  function handleUseAsInspiration(entry){
    setDirectorAngle(`Vault inspiration: ${entry.title} — ${entry.why_it_works||''}`);
    setView('director');
  }

  function handleCaptureSave(c){
    setCaptures(prev=>[c,...prev]);
  }

  if(authLoading)return<div style={{display:'flex',alignItems:'center',justifyContent:'center',
    height:'100vh',background:C.bg}}>
    <div className="breathe" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:C.textMuted}}>
      Loading...
    </div>
  </div>;

  if(!user)return<AuthScreen onAuth={setUser}/>;

  return<div style={{display:'flex',height:'100vh',background:C.bg,overflow:'hidden'}}>
    {isDesktop&&<div style={{
      width:220,background:C.bg,borderRight:`1px solid ${C.borderSubtle}`,
      display:'flex',flexDirection:'column',flexShrink:0
    }}>
      <div style={{padding:'24px 20px 20px',borderBottom:`1px solid ${C.borderSubtle}`}}>
        <div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,color:C.text}}>Dream Director</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:C.textMuted,marginTop:3}}>
          {user.email?.split('@')[0]}
        </div>
      </div>
      <nav style={{flex:1,padding:'12px 10px'}}>
        {VIEWS.map(v=><button key={v.k} onClick={()=>setView(v.k)} style={{
          display:'flex',alignItems:'center',gap:12,width:'100%',
          padding:'10px 12px',borderRadius:8,border:'none',cursor:'pointer',
          background:view===v.k?C.accentSoft:'transparent',
          color:view===v.k?C.accent:C.textSec,
          fontWeight:view===v.k?500:400,fontSize:14,marginBottom:2,textAlign:'left'
        }}>
          <NavIcon name={v.k} active={view===v.k}/>{v.l}
        </button>)}
      </nav>
      <div style={{padding:'12px 10px',borderTop:`1px solid ${C.borderSubtle}`}}>
        <button onClick={()=>setShowCapture(true)} style={{
          width:'100%',background:C.accentSoft,border:`1px solid ${C.accent}44`,
          borderRadius:8,color:C.accent,fontSize:12,padding:'8px',cursor:'pointer',
          fontWeight:500,marginBottom:8
        }}>+ Quick Capture <span style={{opacity:0.5,fontSize:10}}>(N)</span></button>
        <button onClick={()=>sb.auth.signOut()} style={{
          width:'100%',background:'transparent',border:`1px solid ${C.border}`,
          borderRadius:8,color:C.textMuted,fontSize:12,padding:'8px',cursor:'pointer'
        }}>Sign Out</button>
      </div>
    </div>}

    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
      {!isDesktop&&<div style={{
        background:C.bg,borderBottom:`1px solid ${C.borderSubtle}`,
        padding:'14px 20px',display:'flex',justifyContent:'space-between',
        alignItems:'center',flexShrink:0
      }}>
        <div style={{fontFamily:"'Instrument Serif',serif",fontSize:18,color:C.text}}>Dream Director</div>
        <button onClick={()=>sb.auth.signOut()} style={{
          background:'none',border:'none',color:C.textMuted,fontSize:12,cursor:'pointer'
        }}>Sign out</button>
      </div>}

      <div style={{flex:1,overflowY:'auto'}}>
        {view==='products'&&<ProductsView
          user={user} products={products} setProducts={setProducts}
          allVideos={allVideos} setAllVideos={setAllVideos}
          onDirector={goToDirector}
          captures={captures} setCaptures={setCaptures}
          onUseAsAngle={handleUseAsAngle}
          onOpenCapture={()=>setShowCapture(true)}
        />}
        {view==='director'&&<DirectorView
          user={user} products={products}
          presetProductId={directorPreset}
          presetAngle={directorAngle}
          allVideos={allVideos} setAllVideos={setAllVideos}
          vault={vault} captures={captures}
        />}
        {view==='vault'&&<VaultView
          vault={vault} setVault={setVault}
          onUseAsInspiration={handleUseAsInspiration}
        />}
        {view==='playbook'&&<PlaybookView/>}
      </div>

      {!isDesktop&&<>
        {/* FAB */}
        <button onClick={()=>setShowCapture(true)} style={{
          position:'absolute',bottom:70,right:20,
          width:52,height:52,borderRadius:'50%',
          background:C.accent,border:'none',color:'#fff',
          fontSize:24,cursor:'pointer',
          boxShadow:'0 4px 20px rgba(79,110,247,0.5)',
          display:'flex',alignItems:'center',justifyContent:'center',
          zIndex:100
        }}>+</button>

        <div style={{
          background:C.bg,borderTop:`1px solid ${C.borderSubtle}`,
          display:'flex',flexShrink:0,
          paddingBottom:'env(safe-area-inset-bottom)'
        }}>
          {VIEWS.map(v=><button key={v.k} onClick={()=>setView(v.k)} style={{
            flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,
            background:'transparent',border:'none',cursor:'pointer',padding:'10px 0'
          }}>
            <NavIcon name={v.k} active={view===v.k}/>
            <span style={{fontSize:9,fontFamily:"'JetBrains Mono',monospace",
              color:view===v.k?C.accent:C.textMuted}}>{v.l}</span>
          </button>)}
        </div>
      </>}
    </div>

    {showCapture&&<QuickCaptureModal
      products={products}
      onClose={()=>setShowCapture(false)}
      onSave={handleCaptureSave}
    />}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
