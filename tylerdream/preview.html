<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to build · Tyler Dream</title>
  <meta http-equiv="refresh" content="0; url=/build">
  <link rel="canonical" href="https://tylerdream.com/build">
  <script>window.location.replace('/build');</script>
  <style>body{background:#080808;color:#fff;font-family:Inter,sans-serif;margin:0;padding:48px 24px;text-align:center;}a{color:#c8ff00;}</style>
</head>
<body>
<!-- ==== UNIFIED SITE BANNER (every page) ==== -->
<style>
  #site-banner-v2 {
    position: sticky; top: 0; left: 0; right: 0; z-index: 9998;
    width: 100%; background: rgba(8,8,8,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
  }
  #site-banner-v2::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(200,255,0,0.45), rgba(160,237,216,0.3), transparent);
  }
  .sb-track {
    display: flex; align-items: center; gap: 14px; padding: 9px 18px;
    white-space: nowrap; overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: rgba(200,255,0,0.3) transparent;
  }
  .sb-track::-webkit-scrollbar { height: 6px; }
  .sb-track::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
  .sb-track::-webkit-scrollbar-thumb { background: rgba(200,255,0,0.25); border-radius: 3px; }
  .sb-track::-webkit-scrollbar-thumb:hover { background: rgba(200,255,0,0.5); }
  .sb-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; text-decoration: none;
    font-family: Inter, sans-serif; font-size: 12px; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .sb-chip:hover { transform: translateY(-1px); }
  .sb-chip--brand { background: rgba(200,255,0,0.08); border: 1px solid rgba(200,255,0,0.28); color: #c8ff00; }
  .sb-chip--brand:hover { background: rgba(200,255,0,0.14); border-color: rgba(200,255,0,0.45); }
  .sb-chip--creator { background: rgba(160,237,216,0.08); border: 1px solid rgba(160,237,216,0.28); color: #a0edd8; }
  .sb-chip--creator:hover { background: rgba(160,237,216,0.14); border-color: rgba(160,237,216,0.45); }
  .sb-chip--affiliate { background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.28); color: #a855f7; }
  .sb-chip--affiliate:hover { background: rgba(168,85,247,0.14); border-color: rgba(168,85,247,0.45); }
  .sb-chip--code {
    background: transparent; border: 1px dashed rgba(160,237,216,0.35); color: #a0edd8;
    font-weight: 700; text-transform: none; letter-spacing: 0.2px;
  }
  .sb-chip--code:hover { border-color: rgba(160,237,216,0.6); background: rgba(160,237,216,0.05); }
  .sb-chip .sb-sub {
    font-size: 11px; font-weight: 600; opacity: 0.65; letter-spacing: 0.2px; text-transform: none;
    margin-left: 4px;
  }
  .sb-dot {
    width: 5px; height: 5px; border-radius: 50%; display: inline-block;
    animation: sb-pulse 1.6s infinite;
  }
  .sb-chip--brand .sb-dot { background: #c8ff00; }
  .sb-chip--creator .sb-dot { background: #a0edd8; animation-delay: 0.4s; }
  .sb-chip--affiliate .sb-dot { background: #a855f7; animation-delay: 0.8s; }
  @keyframes sb-pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  @media (max-width: 600px) {
    .sb-track { gap: 10px; padding: 8px 14px; }
    .sb-chip { padding: 6px 11px; font-size: 11px; }
    .sb-chip .sb-sub { display: none; }
  }
</style>
<div id="site-banner-v2" role="navigation" aria-label="Site paths">
  <div class="sb-track">
    <a class="sb-chip sb-chip--brand" href="/#contact"><span class="sb-dot"></span>For Brands<span class="sb-sub">Hire Dream</span></a>
    <a class="sb-chip sb-chip--creator" href="/build"><span class="sb-dot"></span>For Creators<span class="sb-sub">Get a site</span></a>
    <a class="sb-chip sb-chip--affiliate" href="/affiliate"><span class="sb-dot"></span>Affiliate<span class="sb-sub">$50 per referral</span></a>
    <a class="sb-chip sb-chip--code" href="/build#referral-code-input">Have a code?</a>
  </div>
</div>
<!-- ==== END UNIFIED SITE BANNER ==== -->

  <p>Redirecting&hellip;</p>
  <p><a href="/build">Click here if you are not redirected.</a></p>
</body>
</html>
