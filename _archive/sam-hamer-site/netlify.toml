# Netlify Configuration for Sam Hamer Portfolio Site
# Static site - no build step required

[build]
# No build command needed - all files are static
command = ""
publish = "."

[build.environment]
# No environment variables needed for static site

# Asset optimization
[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.processing.js]
bundle = true
minify = true

[build.processing.html]
pretty_urls = true

# Cache control headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/*.{js,css}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.{jpg,jpeg,png,gif,webp,svg}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
